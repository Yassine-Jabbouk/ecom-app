server:
  port: 8888
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customers
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customers/**
            - id: products
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/products/**